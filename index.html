<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebDev Registration</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top">
<div class="logo">
<span class="code">&lt;/&gt;</span>
<h2>WebDev</h2>
</div>
<button id="darkModeToggle">Dark Mode</button>
</div>

<div class="container">
<h2>Register a new member</h2>
<p class="small">Join the WebDev club community.</p>

<form id="registrationForm">
<div class="row">
<div class="field">
<label>Full Name</label>
<input type="text" id="fullName" placeholder="e.g Njoki Victor">
<span class="error" id="fullNameError"></span>
</div>
<div class="field">
<label>Email</label>
<input type="text" id="email" placeholder="e.g mugo@students.kyu.ac.ke">
<span class="error" id="emailError"></span>
</div>
</div>

<div class="row">
<div class="field">
<label>Password</label>
<input type="password" id="password" placeholder="********">
<span class="error" id="passwordError"></span>
</div>
<div class="field">
<label>Confirm Password</label>
<input type="password" id="confirmPassword" placeholder="********">
<span class="error" id="confirmPasswordError"></span>
</div>
</div>

<div class="row">
<div class="field">
<label>Gender</label>
<select id="gender">
<option value="">-- Select --</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>
<span class="error" id="genderError"></span>
</div>
<div class="field">
<label>Date of Birth</label>
<input type="date" id="dob">
<span class="error" id="dobError"></span>
</div>
</div>

<div class="row">
<div class="field">
<label>Country</label>
<input type="text" id="country" placeholder="e.g Kenya">
<span class="error" id="countryError"></span>
</div>
<div class="field">
<label>Phone Number</label>
<input type="text" id="phone" placeholder="e.g +254 700 000 000">
<span class="error" id="phoneError"></span>
</div>
</div>

<div class="field">
<label>Bio</label>
<textarea id="bio" placeholder="Tell us about yourself..."></textarea>
<span class="error" id="bioError"></span>
</div>

<div id="successMessage" class="success hidden">Registered Successfully!</div>

<button type="submit" class="registerBtn">Register</button>
</form>
</div>

<div class="container">
<h2>Registered Members (<span id="memberCounter">0</span>)</h2>
<p class="small">New sign-ups appear here instantly.</p>
<ul id="memberList"></ul>
<div id="empty" class="empty">No members yet. Register someone to begin.</div>
</div>

<p class="footer">© 2026 WebDev: SPI 2201 Web Application Development, Kirinyaga University.</p>

<script src="script.js"></script>
</body>
  </html>
